name: Bitget 20/50 EMA 30M Scanner

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install websocket-client


      # ======================================================
      # VERIFY WEBSOCKET INSTALLATION
      # ======================================================

      - name: Verify WebSocket package
        run: |
          python -c "import websocket; print('websocket-client installed successfully')"


      # ======================================================
      # VERIFY SCANNER FILE
      # ======================================================

      - name: Verify scanner
        run: |
          python -m py_compile scanner.py
          echo "scanner.py syntax check passed"


      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner.py
